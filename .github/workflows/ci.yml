name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Host unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run host unit tests
        env:
          NODE_ENV: test
        run: npm test

      - name: Verify snippet generator goldens are up to date
        run: |
          if ! npm test > /dev/null 2>&1; then
            echo "::error::Snippet fixtures drifted. Re-run with UPDATE_SNAPSHOTS=1 npm test and commit the diff."
            exit 1
          fi
