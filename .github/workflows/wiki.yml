name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/wiki/**'
      - 'jsdoc.json'

permissions:
  contents: write

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate API Reference from JSDoc
        run: npx jsdoc2md --files 'src/**/*.js' --configure jsdoc.json > docs/wiki/API-Reference.md

      - name: Publish to GitHub Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs/wiki/
          strategy: force
