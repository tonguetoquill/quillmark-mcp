name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/wiki/**'
      - 'jsdoc.json'

permissions:
  contents: write

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate API Reference from JSDoc
        run: npx jsdoc2md --files 'src/**/*.js' --configure jsdoc.json > docs/wiki/API-Reference.md

      - name: Publish to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_DIR=$(mktemp -d)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" "$WIKI_DIR"
          cp docs/wiki/*.md "$WIKI_DIR/"
          cd "$WIKI_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to publish."
          else
            git commit -m "Update wiki from ${GITHUB_SHA::7}"
            git push
          fi
