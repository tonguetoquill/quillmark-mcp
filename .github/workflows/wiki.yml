name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/wiki/**'
      - 'jsdoc.json'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout wiki
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: source

      - name: Regenerate API Reference from JSDoc
        run: npx jsdoc2md --files 'src/**/*.js' --configure jsdoc.json > docs/wiki/API-Reference.md
        working-directory: source

      - name: Copy wiki pages and push
        run: |
          cp source/docs/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to publish."
          else
            git commit -m "Update wiki from ${GITHUB_SHA::7}"
            git push
          fi
