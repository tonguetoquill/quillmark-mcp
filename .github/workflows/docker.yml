name: Docker test harness

# The full six-layer Docker test harness is expensive (60-90s warm, 4 min cold).
# It runs automatically on pushes to main and on PRs that carry the
# `test:docker` label. Contributors can add that label from the PR UI when
# they want the full harness to run against their change.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    name: Should this run?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]] && \
               echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q 'test:docker'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test-docker:
    name: Six-layer Docker harness
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install dependencies
        run: npm ci

      - name: Run six-layer Docker harness
        env:
          DOCKER_BUILDKIT: '1'
        run: npm run test:docker
