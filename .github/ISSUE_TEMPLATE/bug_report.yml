name: Bug report
description: Something isn't working as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Before filing, please
        confirm the stack you're using is listed as **Tested** in
        [`docs/STATUS.md`](../../blob/main/docs/STATUS.md). If it's marked
        **In Progress**, the appropriate place is the client validation issue
        for that stack, not a bug report.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
      placeholder: "When I ran X, Y happened instead of Z."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "I expected Z to happen because the docs say…"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Exact commands and/or code that reproduce the issue. Include the MCP client you're using and its version.
      render: shell
      placeholder: |
        ./scripts/install-mcp.sh
        claude mcp add --transport http quillmark http://127.0.0.1:8080/mcp
        # Then in Claude Code:
        > list quills
        # Error: ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `node --version`, `docker --version`, your OS, and the MCP client + version.
      render: text
      placeholder: |
        node: v24.3.0
        docker: Docker version 28.0.1
        os: macOS 14.5 (darwin-arm64)
        client: Claude Code 1.8.2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Container logs (`docker logs quillmark-mcp`), tool call traces, stack traces. Redact any secrets."
      render: shell

  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight checks
      options:
        - label: I've checked `docs/STATUS.md` and my stack is listed as **Tested**
          required: true
        - label: I've searched existing issues for this bug
          required: true
        - label: I can reproduce this against the latest commit on `main`
          required: true
