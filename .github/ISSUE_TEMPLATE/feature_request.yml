name: Feature request
description: Suggest a new capability, tool, client integration, or enhancement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please check:
        - **Adding a new client?** Use the "Client validation" template instead —
          we track each client stack as its own tracking issue.
        - **Security issue?** Use GitHub Security Advisories, not a public issue.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point. "I want X" is less useful than "When I try X, I hit Y, which costs me Z."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the server (or docs, or scripts) to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why they're worse.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - MCP server / tools
        - Docker image / compose
        - CLI / snippet generator
        - Client integrations
        - Tests / CI
        - Docs
        - Scripts (install / uninstall)
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR for this if we agree on the design.
