quill:
  name: x_post
  version: 0.1.0
  backend: typst
  plate_file: plate.typ
  description: X (Twitter) feed mockup — multiple posts, replies, quoted tweets, Community Notes. For wargaming/exercise injects and training materials.
main:
  fields:
    theme:
      type: string
      default: dim
      enum:
      - light
      - dim
      - lights_out
      ui:
        group: Appearance
      description: Visual theme. "dim" (default) is the blue-black X dark mode; "light" is white; "lights_out" is pure black.
    feed_header:
      type: string
      default: ''
      example: For you
      ui:
        group: Feed
      description: Optional header bar label. Leave empty to omit.
    viewer_handle:
      type: string
      default: ''
      ui:
        group: Feed
      description: Handle of the notional viewer (unused in v0.1.0 but reserved for future highlight states).
card_kinds:
  post:
    description: A top-level X post shown in the feed. Multiple posts render in order.
    fields:
      display_name:
        type: string
        required: true
        example: Pentagon Press Secretary
        ui:
          group: Author
        description: Author's display name (shown in bold).
      handle:
        type: string
        required: true
        example: PentagonPresSec
        ui:
          group: Author
        description: X handle without the @ prefix.
      verified:
        type: string
        default: 'false'
        enum:
        - 'true'
        - 'false'
        ui:
          group: Author
        description: Set to "true" to show a verified checkmark.
      verified_type:
        type: string
        default: blue
        enum:
        - blue
        - gold
        - gray
        ui:
          group: Author
        description: Checkmark color. blue = individual, gold = business/organization, gray = government/multilateral.
      avatar_initials:
        type: string
        required: true
        example: PP
        ui:
          group: Author
        description: 1–2 character initials rendered inside a colored avatar circle.
      avatar_color:
        type: string
        default: '#1D9BF0'
        example: '#1D9BF0'
        ui:
          group: Author
        description: Hex color for the avatar circle background.
      timestamp:
        type: string
        required: true
        example: 4:12 PM · Apr 15, 2026
        ui:
          group: Post
        description: Freeform timestamp string. Relative ("2h") for feed context, absolute for permalink-style posts.
      reply_count:
        type: string
        default: ''
        example: '1234'
        ui:
          group: Engagement
        description: Integer count. Template formats compactly (1.2K). Leave empty or "0" to hide.
      repost_count:
        type: string
        default: ''
        ui:
          group: Engagement
        description: Integer count of reposts (retweets). Leave empty to hide.
      quote_count:
        type: string
        default: ''
        ui:
          group: Engagement
        description: Integer count of quote tweets. Reserved for future use.
      like_count:
        type: string
        default: ''
        ui:
          group: Engagement
        description: Integer count of likes.
      bookmark_count:
        type: string
        default: ''
        ui:
          group: Engagement
        description: Integer count of bookmarks.
      view_count:
        type: string
        default: ''
        ui:
          group: Engagement
        description: 'Integer count of views. Realism guide: views ≈ 20–100× likes for organic posts.'
      client:
        type: string
        default: ''
        example: X for iPhone
        ui:
          group: Post
        description: Source client label (shown below engagement bar if set).
      community_note:
        type: string
        default: ''
        ui:
          group: Post
        description: Text of a Community Note rendered as a rounded card above the engagement bar. Leave empty to omit.
      pinned:
        type: string
        default: 'false'
        enum:
        - 'true'
        - 'false'
        ui:
          group: Post
        description: Show a "📌 Pinned" indicator above the post.
  reply:
    description: A reply card attached to a post by its 0-based index. One level of replies only.
    fields:
      belongs_to_post_index:
        type: number
        required: true
        example: 0
        ui:
          group: Threading
        description: Zero-based index of the `post` card this reply is attached to.
      replying_to_handles:
        type: string
        default: ''
        example: PentagonPresSec
        ui:
          group: Threading
        description: Comma-separated handles (no @). Renders as "Replying to @a, @b and @c".
      display_name:
        type: string
        required: true
        ui:
          group: Author
        description: Reply author display name.
      handle:
        type: string
        required: true
        ui:
          group: Author
      verified:
        type: string
        default: 'false'
        enum:
        - 'true'
        - 'false'
        ui:
          group: Author
      verified_type:
        type: string
        default: blue
        enum:
        - blue
        - gold
        - gray
        ui:
          group: Author
      avatar_initials:
        type: string
        required: true
        ui:
          group: Author
      avatar_color:
        type: string
        default: '#1D9BF0'
        ui:
          group: Author
      timestamp:
        type: string
        required: true
        ui:
          group: Post
      reply_count:
        type: string
        default: ''
        ui:
          group: Engagement
      repost_count:
        type: string
        default: ''
        ui:
          group: Engagement
      like_count:
        type: string
        default: ''
        ui:
          group: Engagement
      view_count:
        type: string
        default: ''
        ui:
          group: Engagement
      bookmark_count:
        type: string
        default: ''
        ui:
          group: Engagement
      community_note:
        type: string
        default: ''
        ui:
          group: Post
  quoted_tweet:
    description: A quoted tweet rendered as a nested card inside a post or reply. Attach by `attached_to` + `belongs_to_post_index`.
    fields:
      attached_to:
        type: string
        default: post
        enum:
        - post
        - reply
        ui:
          group: Threading
        description: Whether this quote appears inside a top-level post or a reply.
      belongs_to_post_index:
        type: number
        required: true
        ui:
          group: Threading
        description: Zero-based index of the parent post (if attached_to=post) or reply (if attached_to=reply).
      display_name:
        type: string
        required: true
        ui:
          group: Author
      handle:
        type: string
        required: true
        ui:
          group: Author
      verified:
        type: string
        default: 'false'
        enum:
        - 'true'
        - 'false'
        ui:
          group: Author
      verified_type:
        type: string
        default: blue
        enum:
        - blue
        - gold
        - gray
        ui:
          group: Author
      avatar_initials:
        type: string
        required: true
        ui:
          group: Author
      avatar_color:
        type: string
        default: '#1D9BF0'
        ui:
          group: Author
      timestamp:
        type: string
        required: true
        ui:
          group: Post
