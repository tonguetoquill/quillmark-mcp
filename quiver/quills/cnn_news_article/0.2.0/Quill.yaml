quill:
  name: cnn_news_article
  version: 0.2.0
  backend: typst
  plate_file: plate.typ
  description: CNN-style web news article for wargaming exercise injects
main:
  fields:
    headline:
      type: string
      example: NATO allies scramble as tensions escalate near Baltic corridor
      ui:
        group: Article
      description: Primary headline. Use sentence case. Keep under 140 characters.
    subheadline:
      type: string
      default: ''
      ui:
        group: Article
      description: Optional secondary headline or summary line.
    author:
      type: string
      example: Marcus J. Reed
      ui:
        group: Article
      description: Reporter or author name (without 'By' prefix -- the template adds it).
    author_title:
      type: string
      default: ''
      example: CNN Pentagon Correspondent
      ui:
        group: Article
      description: Author's title or beat, displayed below the author name.
    dateline:
      type: string
      default: ''
      example: Washington, DC
      ui:
        group: Article
      description: Location where the story was filed.
    category:
      type: string
      enum:
      - Politics
      - World
      - U.S.
      - Business
      - Health
      - Entertainment
      - Tech
      - Science
      - National Security
      - Military
      example: National Security
      ui:
        group: Metadata
      description: CNN section or category for this article.
    publication_date:
      type: string
      example: '2026-04-13'
      ui:
        group: Metadata
      description: Original publication date in YYYY-MM-DD format.
    updated_date:
      type: string
      default: ''
      ui:
        group: Metadata
      description: Date of last update. Displayed as 'Updated' timestamp. Leave blank to omit.
    breaking_news:
      type: boolean
      default: false
      ui:
        group: Article
      description: Set to true to display a red BREAKING NEWS banner above the headline.
    summary:
      type: string
      default: ''
      ui:
        group: Metadata
      description: Brief summary or key points. Displayed in a highlighted block under the headline.
    editors_note:
      type: string
      default: ''
      ui:
        group: Additional
      description: Optional editor's note rendered in a highlighted box before the article body.
    tags:
      type: array
      default: []
      items:
        type: string
      example:
      - NATO
      - Baltic
      - Defense
      ui:
        group: Metadata
      description: Array of topic keywords.
card_kinds:
  live_update:
    description: A timestamped live update entry. Multiple live_update cards create a chronological update feed.
    fields:
      timestamp:
        type: string
        example: 2026-04-13 14:30 ET
        ui:
          group: Update
        description: Timestamp for this live update entry.
      update_headline:
        type: string
        default: ''
        ui:
          group: Update
        description: Optional short headline for this update.
  related_story:
    description: A related story reference rendered in the footer area.
    fields:
      story_headline:
        type: string
        example: Pentagon moves additional assets to Eastern Europe
        ui:
          group: Related
        description: Headline of the related story.
      story_source:
        type: string
        default: CNN
        ui:
          group: Related
        description: Source of the related story.
