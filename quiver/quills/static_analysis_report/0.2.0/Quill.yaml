quill:
  name: static_analysis_report
  version: 0.2.0
  backend: typst
  plate_file: plate.typ
  description: Cybersecurity assessment report template for weapon system and mission software baselines
main:
  fields:
    report_title:
      type: string
      default: Weapon System Cybersecurity Report
      ui:
        group: Header
      description: Main title displayed on the cover page.
    subtitle:
      type: string
      default: ''
      ui:
        group: Header
      description: Optional subtitle displayed below the main title. Leave empty to omit.
    report_type:
      type: string
      default: WEAPON SYSTEM CYBERSECURITY ASSESSMENT REPORT
      ui:
        group: Header
      description: Formal report type text shown on the cover page.
    classification:
      type: string
      default: unclassified
      enum:
      - unclassified
      - fouo
      - cui
      - confidential
      ui:
        group: Header
      description: Classification level used for top/bottom banners and running header/footer.
    classification_caveats:
      type: string
      default: ''
      ui:
        group: Header
      description: Optional caveat suffix appended to the classification banner (e.g. NOFORN).
    document_number:
      type: string
      default: UNSPECIFIED
      ui:
        group: Header
      description: Document identifier displayed in the running footer.
    seal_image:
      type: string
      default: ''
      ui:
        group: Header
      description: Optional path to an official seal image. Leave empty to use text fallback.
    version:
      type: string
      default: '1.0'
      ui:
        group: Header
      description: Version shown in the document control block.
    supersedes:
      type: string
      default: ''
      ui:
        group: Header
      description: Optional prior report identifier superseded by this report.
    preparing_organization:
      type: string
      default: ''
      ui:
        group: Header
      description: Organization responsible for preparing the report.
    poc_name:
      type: string
      default: ''
      ui:
        group: Header
      description: Point of contact name displayed on the cover page.
    poc_title:
      type: string
      default: ''
      ui:
        group: Header
      description: Point of contact title displayed on the cover page.
    poc_email:
      type: string
      default: ''
      ui:
        group: Header
      description: Point of contact email displayed on the cover page.
    poc_phone:
      type: string
      default: ''
      ui:
        group: Header
      description: Point of contact phone displayed on the cover page.
    distribution_statement:
      type: string
      default: a
      ui:
        group: Header
      description: Distribution statement keyword (a-f) or full custom statement text.
    cover_stamp:
      type: string
      default: ''
      ui:
        group: Header
      description: Optional stamp text (for example DRAFT or REVIEWED) rendered on the cover.
    authority:
      type: string
      default: ''
      ui:
        group: Header
      description: Optional authority statement rendered on an inside-cover page.
    handling_notice:
      type: string
      default: ''
      ui:
        group: Header
      description: Optional handling/disclosure notice rendered on an inside-cover page.
    executive_summary:
      type: string
      default: ''
      ui:
        group: Header
      description: Optional narrative executive summary text.
    system_name:
      type: string
      example: RAPTOR-9X Fire Control Mission Software Package (MSP)
      ui:
        group: Header
      description: Name or designation of the weapon system or mission software baseline under assessment.
    system_identifier:
      type: string
      example: WS-R9X-FCS-MSP-02.04.01-BL47
      ui:
        group: Header
      description: Part number, build ID, or other unique baseline identifier for the assessed software image.
    system_version:
      type: string
      example: 2.4.1
      ui:
        group: Header
      description: Version string of the assessed system software baseline.
    platform:
      type: string
      default: ''
      example: Green Hills INTEGRITY RTOS 19.0 (ARMv8-A)
      ui:
        group: Header
      description: Operating environment or platform for the assessed software (for example RTOS, embedded Linux, or hypervisor partition).
    scan_date:
      type: string
      example: '2025-07-03'
      ui:
        group: Header
      description: Date the cybersecurity assessment or analysis was performed, in YYYY-MM-DD format.
    file_name:
      type: string
      example: R9X-FCS-MSP_v2.4.1-signed.bin
      ui:
        group: File Information
      description: Name of the analyzed artifact (for example signed firmware image, container, or installer).
    security_score:
      type: number
      example: 44
      ui:
        group: Scorecard
      description: Aggregate security score from 0 (worst) to 100 (best).
    risk_level:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      example: MEDIUM
      ui:
        group: Scorecard
      description: Overall risk level based on the security score and findings.
    findings_high:
      type: number
      default: 0
      ui:
        group: Scorecard
      description: Number of high-severity issues found.
    findings_warning:
      type: number
      default: 0
      ui:
        group: Scorecard
      description: Number of warning/medium-severity issues found.
    findings_info:
      type: number
      default: 0
      ui:
        group: Scorecard
      description: Number of informational findings.
    findings_secure:
      type: number
      default: 0
      ui:
        group: Scorecard
      description: Number of security features confirmed as present.
    findings_hotspot:
      type: number
      default: 0
      ui:
        group: Scorecard
      description: Number of security hotspots requiring review.
    file_size:
      type: string
      default: ''
      example: 52.3 MB
      ui:
        group: File Information
      description: Size of the analyzed file.
    md5:
      type: string
      default: ''
      ui:
        group: File Information
      description: MD5 hash of the analyzed file.
    sha1:
      type: string
      default: ''
      ui:
        group: File Information
      description: SHA1 hash of the analyzed file.
    sha256:
      type: string
      default: ''
      ui:
        group: File Information
      description: SHA256 hash of the analyzed file.
    system_type:
      type: string
      default: ''
      example: Safety-critical embedded fire-control subsystem
      ui:
        group: System
      description: High-level category or role of the assessed system (for example flight-critical, maintenance, or ground support).
    sdk_name:
      type: string
      default: ''
      ui:
        group: Build & Platform
      description: Name of the SDK or toolchain used to build the system software.
    sdk_version:
      type: string
      default: ''
      ui:
        group: Build & Platform
      description: Version of the SDK.
    build_number:
      type: string
      default: ''
      ui:
        group: Build & Platform
      description: Build number of the system software baseline.
    platform_version:
      type: string
      default: ''
      ui:
        group: Build & Platform
      description: Target platform version.
    min_os_version:
      type: string
      default: ''
      ui:
        group: Build & Platform
      description: Minimum OS or runtime version required by the system software, if applicable.
    supported_platforms:
      type: string
      default: ''
      example: RAPTOR-9X Weapon Computer Assembly (WCA-3)
      ui:
        group: Build & Platform
      description: Comma-separated list of hardware or deployment targets supported by the system software.
    architecture:
      type: string
      default: ''
      example: ARM64
      ui:
        group: Binary Information
      description: CPU architecture of the binary.
    sub_architecture:
      type: string
      default: ''
      example: ARM64E
      ui:
        group: Binary Information
      description: CPU sub-architecture.
    bit_width:
      type: string
      default: ''
      example: 64-bit
      ui:
        group: Binary Information
      description: Bit width of the binary (32-bit or 64-bit).
    endianness:
      type: string
      default: ''
      example: Little Endian
      ui:
        group: Binary Information
      description: Byte order of the binary.
    binary_findings:
      type: array
      default: []
      items:
        type: object
        properties:
          issue:
            type: string
          severity:
            type: string
          standards:
            type: string
          description:
            type: string
      ui:
        group: Findings
      description: 'Array of binary code analysis findings. Each item is a YAML mapping with keys: issue (string), severity (high|warning|info|secure), standards (e.g. CWE-330), description (string).'
      example:
      - issue: Insecure Random Function
        severity: high
        standards: CWE-330
        description: System image uses insecure random number generation
    security_features:
      type: array
      default: []
      items:
        type: object
        properties:
          protection:
            type: string
          status:
            type: string
          severity:
            type: string
          description:
            type: string
      ui:
        group: Findings
      description: 'Array of binary security feature checks. Each item is a YAML mapping with keys: protection (string), status (True/False string), severity (high|warning|info|secure), description (string).'
      example:
      - protection: NX (Non-Executable Stack)
        status: 'True'
        severity: secure
        description: Stack is marked non-executable
    dependencies:
      type: array
      default: []
      items:
        type: object
        properties:
          path:
            type: string
          nx:
            type: string
          stack_canary:
            type: string
          arc:
            type: string
          rpath:
            type: string
          code_signature:
            type: string
          encrypted:
            type: string
      ui:
        group: Dependencies
      description: 'Array of dependency analysis results. Each item is a YAML mapping with keys: path (string), nx, stack_canary, arc, rpath, code_signature, encrypted. Security-check values are severity levels: high, warning, info, secure.'
      example:
      - path: Frameworks/libswiftCore.dylib
        nx: secure
        stack_canary: secure
        arc: secure
        rpath: secure
        code_signature: secure
        encrypted: info
    domains:
      type: array
      default: []
      items:
        type: object
        properties:
          url:
            type: string
          status:
            type: string
          ip:
            type: string
          country:
            type: string
          city:
            type: string
      ui:
        group: Network
      description: 'Array of domain check results. Each item is a YAML mapping with keys: url (string), status (string), ip (string), country (string), city (string).'
      example:
      - url: api.example.com
        status: OK
        ip: 192.0.2.1
        country: United States
        city: San Francisco, CA
    emails_found:
      type: array
      default: []
      items:
        type: object
        properties:
          value:
            type: string
          source:
            type: string
      ui:
        group: Reconnaissance
      description: 'Array of discovered email addresses. Each item is a YAML mapping with keys: value (string), source (string).'
      example:
      - value: support@example.com
        source: Main Binary
    urls_found:
      type: array
      default: []
      items:
        type: object
        properties:
          value:
            type: string
          source:
            type: string
      ui:
        group: Reconnaissance
      description: 'Array of discovered URLs. Each item is a YAML mapping with keys: value (string), source (string).'
      example:
      - value: https://api.example.com/v1/
        source: Main Binary
    secrets_found:
      type: array
      default: []
      items:
        type: object
        properties:
          value:
            type: string
          source:
            type: string
      ui:
        group: Reconnaissance
      description: 'Array of discovered secrets. Each item is a YAML mapping with keys: value (string), source (string).'
      example:
      - value: Test API key material detected
        source: embedded manifest
    scan_logs:
      type: array
      default: []
      items:
        type: object
        properties:
          timestamp:
            type: string
          event:
            type: string
          status:
            type: string
      ui:
        group: Logs
      description: 'Array of scan log entries. Each item is a YAML mapping with keys: timestamp (string), event (string), status (string, typically "OK" or error text).'
      example:
      - timestamp: '2025-07-03 14:32:01'
        event: Analysis started
        status: OK
    recommendations:
      type: array
      default: []
      items:
        type: object
        properties:
          priority:
            type: string
          finding_reference:
            type: string
          recommended_action:
            type: string
      ui:
        group: Findings
      description: Array of recommendation records. Each item can include priority, finding_reference, and recommended_action (or action/recommendation aliases).
      example:
      - priority: HIGH
        finding_reference: CWE-330
        recommended_action: Replace insecure PRNG with a cryptographically secure source.
    acronyms:
      type: array
      default: []
      items:
        type: object
        properties:
          acronym:
            type: string
          expansion:
            type: string
      ui:
        group: Footer
      description: Array of acronym records for Appendix A. Each item can include acronym/expansion (or term/definition aliases).
      example:
      - acronym: ASLR
        expansion: Address Space Layout Randomization
    references:
      type: array
      default: []
      items:
        type: string
      ui:
        group: Footer
      description: Array of reference strings or records for Appendix B.
      example:
      - NIST SP 800-53 Rev. 5, Security and Privacy Controls for Information Systems and Organizations
    ofac_warning:
      type: string
      default: ''
      ui:
        group: Network
      description: If the system communicates with OFAC-sanctioned countries, provide warning text here. Leave empty to omit the warning block.
    generator_name:
      type: string
      default: MobSF
      ui:
        group: Footer
      description: Name of the tool that generated this report.
    generator_version:
      type: string
      default: ''
      ui:
        group: Footer
      description: Version of the report generator tool.
