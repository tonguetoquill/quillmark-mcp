quill:
  name: discord_chat
  version: 0.1.0
  backend: typst
  plate_file: plate.typ
  description: Discord channel chat mockup — messages, replies, embeds, reactions, system messages. For wargaming/exercise injects and training materials.
main:
  fields:
    theme:
      type: string
      default: dark
      enum:
      - dark
      - legacy
      - light
      ui:
        group: Appearance
      description: 'dark (default, 2022+ palette), legacy (pre-2022 #36393F), or light.'
    server_name:
      type: string
      default: ''
      example: Joint Task Force 26
      ui:
        group: Channel
      description: Optional server name label, shown below the channel name.
    channel_name:
      type: string
      example: ops-coord
      ui:
        group: Channel
      description: Channel name without the
    channel_topic:
      type: string
      default: ''
      example: Real-time operations coordination | no classified chatter
      ui:
        group: Channel
      description: Optional channel topic shown next to channel name.
card_kinds:
  message:
    description: 'A Discord message from a user. Use sentinel tokens in body_md: {@user}, {#channel}, {@everyone}, {spoiler:hidden text}. Inline markdown: **bold**, *italic*, __underline__, ~~strike~~, `code`, ```lang\nblock```.'
    fields:
      username:
        type: string
        example: Capt.Reyes
        ui:
          group: Author
        description: Display name shown before the timestamp.
      user_color:
        type: string
        default: '#F2F3F5'
        example: '#ED4245'
        ui:
          group: Author
        description: Hex color for username — typically the user's highest role color.
      avatar_initials:
        type: string
        example: CR
        ui:
          group: Author
      avatar_color:
        type: string
        default: '#5865F2'
        ui:
          group: Author
      is_bot:
        type: string
        default: 'false'
        enum:
        - 'true'
        - 'false'
        ui:
          group: Author
        description: Show the APP (or BOT in legacy theme) tag next to the username.
      is_verified_app:
        type: string
        default: 'false'
        enum:
        - 'true'
        - 'false'
        ui:
          group: Author
        description: Show a checkmark in the APP tag (verified application).
      timestamp:
        type: string
        example: Today at 3:45 PM
        ui:
          group: Message
        description: Freeform timestamp (Discord uses contextual phrasing like "Today at X").
      body_md:
        type: string
        example: Hey {@Sergeant}, the {#intel-feed} just dropped **BREAKING** ||check it now||
        ui:
          group: Message
        description: Message content. Supports bold/italic/strike/underline/code/code-block and Discord sentinels {@user} {#channel} {@everyone} {spoiler:...}
      replying_to_user:
        type: string
        default: ''
        ui:
          group: Threading
        description: If present, renders a reply reference above the message.
      replying_to_color:
        type: string
        default: ''
        ui:
          group: Threading
      replying_to_preview:
        type: string
        default: ''
        ui:
          group: Threading
        description: Short preview of the message being replied to.
      replying_to_initials:
        type: string
        default: '?'
        ui:
          group: Threading
      replying_to_avatar_color:
        type: string
        default: '#5865F2'
        ui:
          group: Threading
      reactions:
        type: string
        default: ''
        example: 👍:3,❤️:1,🔥:12*
        ui:
          group: Engagement
        description: Comma-separated emoji:count pairs. Trailing * marks viewer's own reaction.
      edited:
        type: string
        default: 'false'
        enum:
        - 'true'
        - 'false'
        ui:
          group: Message
        description: Show (edited) after the message body.
      pinned:
        type: string
        default: 'false'
        enum:
        - 'true'
        - 'false'
        ui:
          group: Message
      group_with_previous:
        type: string
        default: 'false'
        enum:
        - 'true'
        - 'false'
        ui:
          group: Message
        description: Hide avatar and username (same author as previous message within ~7 min).
  embed:
    description: Rich embed shown below a specific message.
    fields:
      belongs_to_message_index:
        type: number
        ui:
          group: Threading
        description: Zero-based index of the message this embed is attached to (counting only `message` cards).
      color:
        type: string
        default: '#5865F2'
        ui:
          group: Appearance
      author_name:
        type: string
        default: ''
        ui:
          group: Content
      title:
        type: string
        default: ''
        ui:
          group: Content
      description:
        type: string
        default: ''
        ui:
          group: Content
      url:
        type: string
        default: ''
        ui:
          group: Content
      image_caption:
        type: string
        default: ''
        ui:
          group: Content
        description: Renders a gray placeholder box with this caption (no actual image upload in v0.1.0).
      footer_text:
        type: string
        default: ''
        ui:
          group: Content
  system_message:
    description: Non-user events like joins, pins, boosts.
    fields:
      type:
        type: string
        default: join
        enum:
        - join
        - leave
        - pin
        - boost
        - call_start
        - call_end
        ui:
          group: Event
      username:
        type: string
        ui:
          group: Event
      timestamp:
        type: string
        ui:
          group: Event
      target_message_preview:
        type: string
        default: ''
        ui:
          group: Event
