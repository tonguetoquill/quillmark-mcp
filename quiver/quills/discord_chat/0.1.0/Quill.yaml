quill:
  name: discord_chat
  version: 0.1.0
  backend: typst
  plate_file: plate.typ
  description: Discord channel chat mockup — messages, replies, embeds, reactions, system messages. For wargaming/exercise injects and training materials.
main:
  fields:
    theme:
      type: string
      default: dark
      enum:
      - dark
      - legacy
      - light
      ui:
        group: Appearance
      description: 'dark (default, 2022+ palette), legacy (pre-2022 #36393F), or light.'
    server_name:
      type: string
      default: ''
      example: Joint Task Force 26
      ui:
        group: Channel
      description: Optional server name label, shown below the channel name.
    channel_name:
      type: string
      example: ops-coord
      ui:
        group: Channel
      description: Channel name without the leading # prefix.
    channel_topic:
      type: string
      default: ''
      example: Real-time operations coordination | no classified chatter
      ui:
        group: Channel
      description: Optional channel topic shown next to channel name.
card_kinds:
  message:
    description: "A Discord message from a user. The message body is the markdown prose written after the card's YAML block. Standard markdown is supported (**bold**, *italic*, `inline code`, ```code blocks```). Discord sentinel tokens are also recognized in the body: {@user}, {@everyone}, {@here}, {#channel}, {spoiler:hidden text}, and ||spoiler||."
    body:
      example: "Hey {@Sergeant}, the {#intel-feed} just dropped **BREAKING** ||check it now||"
    fields:
      username:
        type: string
        example: Capt.Reyes
        ui:
          group: Author
        description: Display name shown before the timestamp.
      user_color:
        type: string
        default: '#F2F3F5'
        example: '#ED4245'
        ui:
          group: Author
        description: Hex color for username — typically the user's highest role color.
      avatar_initials:
        type: string
        example: CR
        ui:
          group: Author
        description: 1–2 character initials shown inside the avatar circle when no avatar image is rendered.
      avatar_color:
        type: string
        default: '#5865F2'
        ui:
          group: Author
        description: Hex color for the avatar circle background.
      is_bot:
        type: boolean
        default: false
        ui:
          group: Author
        description: Show the APP (or BOT in legacy theme) tag next to the username.
      is_verified_app:
        type: boolean
        default: false
        ui:
          group: Author
        description: Show a checkmark in the APP tag (verified application).
      timestamp:
        type: string
        example: Today at 3:45 PM
        ui:
          group: Message
        description: Freeform timestamp (Discord uses contextual phrasing like "Today at X").
      replying_to_user:
        type: string
        default: ''
        ui:
          group: Threading
        description: If present, renders a reply reference above the message.
      replying_to_color:
        type: string
        default: ''
        ui:
          group: Threading
        description: Hex color for the replied-to user's name in the reply reference. Should match that user's `user_color`.
      replying_to_preview:
        type: string
        default: ''
        ui:
          group: Threading
        description: Short preview of the message being replied to.
      replying_to_initials:
        type: string
        default: '?'
        ui:
          group: Threading
        description: Avatar initials of the replied-to user, shown in the reply reference.
      replying_to_avatar_color:
        type: string
        default: '#5865F2'
        ui:
          group: Threading
        description: Hex color for the replied-to user's avatar circle. Should match that user's `avatar_color`.
      reactions:
        type: string
        default: ''
        example: 👍:3,❤️:1,🔥:12*
        ui:
          group: Engagement
        description: Comma-separated emoji:count pairs. Trailing * marks viewer's own reaction.
      edited:
        type: boolean
        default: false
        ui:
          group: Message
        description: Show (edited) after the message body.
      pinned:
        type: boolean
        default: false
        ui:
          group: Message
        description: Mark this message as pinned in the channel.
      group_with_previous:
        type: boolean
        default: false
        ui:
          group: Message
        description: Hide avatar and username (same author as previous message within ~7 min).
  embed:
    description: Rich embed shown below a specific message.
    fields:
      belongs_to_message_index:
        type: number
        ui:
          group: Threading
        description: Zero-based index of the message this embed is attached to (counting only `message` cards).
      color:
        type: string
        default: '#5865F2'
        ui:
          group: Appearance
        description: Hex color for the embed's left accent bar.
      author_name:
        type: string
        default: ''
        ui:
          group: Content
        description: Small author name shown above the embed title.
      title:
        type: string
        default: ''
        ui:
          group: Content
        description: Embed title shown in bold above the description.
      description:
        type: string
        default: ''
        ui:
          group: Content
        description: Main body text of the embed.
      url:
        type: string
        default: ''
        ui:
          group: Content
        description: Optional URL that makes the title a clickable link.
      image_caption:
        type: string
        default: ''
        ui:
          group: Content
        description: Renders a gray placeholder box with this caption (no actual image upload in v0.1.0).
      footer_text:
        type: string
        default: ''
        ui:
          group: Content
        description: Small footer text shown at the bottom of the embed.
  system_message:
    description: Non-user events like joins, pins, boosts.
    fields:
      type:
        type: string
        default: join
        enum:
        - join
        - leave
        - pin
        - boost
        - call_start
        - call_end
        ui:
          group: Event
        description: Kind of system event. Determines icon and phrasing (e.g. "X joined the channel", "X pinned a message").
      username:
        type: string
        ui:
          group: Event
        description: User whose action triggered the system event.
      timestamp:
        type: string
        ui:
          group: Event
        description: Freeform timestamp shown next to the event line.
      target_message_preview:
        type: string
        default: ''
        ui:
          group: Event
        description: For pin events, short preview of the pinned message. Ignored for other event types.
