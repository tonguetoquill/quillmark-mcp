quill:
  name: usaf_intel_brief
  version: 0.2.0
  backend: typst
  plate_file: plate.typ
  description: USAF/DoD intelligence briefing (landscape 16:9) with CAPCO classification markings, ICD 203 confidence doctrine, AF Style Briefing layout. Author-controlled classification; opt-in notional/EXERCISE mode.
main:
  fields:
    classification:
      type: string
      enum:
      - UNCLASSIFIED
      - CUI
      - CONFIDENTIAL
      - SECRET
      - TOP SECRET
      example: SECRET
      ui:
        group: Classification
      description: Primary classification level. SCI/SAP compartments go in classification_caveats (template detects SCI keywords).
    classification_caveats:
      type: string
      default: ''
      example: NOFORN
      ui:
        group: Classification
      description: CAPCO caveats, separated by //. Template enforces canonical ordering (NOFORN > REL TO > RELIDO > ORCON > PROPIN > FISA). Unknown caveats kept in author order.
    notional:
      type: boolean
      default: false
      ui:
        group: Classification
      description: Opt-in. true adds EXERCISE — EXERCISE — EXERCISE strap above and below banners and a diagonal NOTIONAL watermark on every slide. Leave false for real products.
    exercise_name:
      type: string
      default: ''
      example: EXERCISE TANAGER FORGE 26-01
      ui:
        group: Classification
      description: Codename shown in the EXERCISE strap (only when notional=true).
    brief_title:
      type: string
      example: Adversary Air Order of Battle — 24-Hour Update
      ui:
        group: Title
      description: Main title of the brief.
    subtitle:
      type: string
      default: ''
      ui:
        group: Title
    briefer:
      type: string
      example: Capt J. Doe, 673 ABW/A2
      ui:
        group: Title
    prepared_for:
      type: string
      example: COMUSPACAF
      ui:
        group: Title
    dtg:
      type: string
      example: 151400ZAPR26
      ui:
        group: Title
      description: 'Joint DTG format: DD HHMM Z MMM YY. Always Zulu for intel products.'
    unit:
      type: string
      example: 673 ABW/A2
      ui:
        group: Title
    classified_by:
      type: string
      default: ''
      ui:
        group: Authority
    derived_from:
      type: string
      default: ''
      ui:
        group: Authority
    declassify_on:
      type: string
      default: ''
      example: '20510415'
      ui:
        group: Authority
    reason:
      type: string
      default: ''
      ui:
        group: Authority
      description: For original classification decisions only (cites EO 13526 §1.4 categories). Leave empty for derivative.
    left_seal:
      type: string
      default: usaf_seal.svg
      ui:
        group: Seals
      description: Filename under assets/. Defaults to bundled USAF seal. Author may drop unit/MAJCOM seal into assets/ and reference by filename.
    center_seal:
      type: string
      default: dod_seal.svg
      ui:
        group: Seals
    right_seal:
      type: string
      default: ''
      ui:
        group: Seals
      description: Optional. Use ussf_seal.svg for Space Force briefs, or a command emblem.
    wordmark:
      type: string
      default: usaf_wordmark.svg
      ui:
        group: Seals
    show_wordmark:
      type: boolean
      default: true
      ui:
        group: Seals
card_kinds:
  slide:
    description: A single content slide. Use `slide_type` to invoke a doctrine-specific layout (bluf, confidence, mlcoa, mdcoa, etc.).
    fields:
      slide_type:
        type: string
        default: generic
        enum:
        - generic
        - bluf
        - situation
        - threat_assessment
        - ob
        - mlcoa
        - mdcoa
        - iw
        - impact
        - gaps
        - confidence
        ui:
          group: Layout
        description: Layout hint. bluf → BLUF box; confidence → ICD 203 likelihood+confidence block; mlcoa/mdcoa → COA layout.
      portion:
        type: string
        default: U
        example: U
        ui:
          group: Classification
        description: Portion mark applied to bullets/captions that don't specify their own. Bare letters; template wraps in parens.
      title:
        type: string
        ui:
          group: Content
        description: Supports inline `**bold**` emphasis. Title bars are already bold; markers are stripped so literal asterisks do not render.
      bullets:
        type: string
        default: ''
        ui:
          group: Content
        description: 'One bullet per line. Prefix with `- ` (L1), `* ` (L2), `– ` (L3), `◦ ` (L4) to set level. Supports inline `**bold**` emphasis. Each bullet should lead with its own (PORTION) mark; if missing, template prepends the slide default. AF Style Briefing guidance: ≤7 bullets, ≤50 words per slide.'
      bluf:
        type: string
        default: ''
        ui:
          group: Content
        description: Shown as a red-rule call-out when slide_type=bluf. Supports inline `**bold**` emphasis.
      likelihood_text:
        type: string
        default: ''
        example: Likely
        ui:
          group: Content
        description: Per ICD 203 — e.g., Almost certainly / Very likely / Likely / Roughly even chance / Unlikely / Very unlikely / Almost no chance.
      confidence_text:
        type: string
        default: ''
        enum:
        - ''
        - High
        - Moderate
        - Low
        ui:
          group: Content
        description: Analyst confidence per ICD 203. Distinct from likelihood.
      notes:
        type: string
        default: ''
        ui:
          group: Content
        description: Rendered as a small italicized block at the bottom of the slide. Supports inline `**bold**` emphasis.
      severity:
        type: string
        default: ''
        enum:
        - ''
        - low
        - moderate
        - high
        - critical
        ui:
          group: Context
        description: Optional threat-severity badge shown top-right on the title bar.
  image_slide:
    description: A slide showing an image (map overlay, chart, photo) with a portion-marked caption.
    fields:
      portion:
        type: string
        default: U
        ui:
          group: Classification
      title:
        type: string
        ui:
          group: Content
        description: Supports inline `**bold**` emphasis. Title bars are already bold; markers are stripped so literal asterisks do not render.
      image_path:
        type: string
        ui:
          group: Content
      caption:
        type: string
        default: ''
        ui:
          group: Content
        description: Supports inline `**bold**` emphasis.
